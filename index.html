<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arm Follow v1</title>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #15171b; color: #dde; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
    #wrap { display: flex; height: 100vh; width: 100vw; }
    #stage { flex: 1; position: relative; overflow: hidden; }
    #stage canvas { display: block; }
    /* ---- visitor HUD ---- */
    #hud { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: min(360px, 70%); pointer-events: none; text-align: center; }
    #hud .label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #c9ced6; margin-bottom: 6px; transition: color 0.2s; }
    .meter { position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); overflow: hidden; }
    .meter.thin { height: 5px; margin-top: 5px; }
    .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #d9dcdf; transition: background 0.2s; }
    .meter .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,0.55); }
    .meter .zone { position: absolute; left: 0; top: 0; bottom: 0; width: 60%; background: rgba(120,230,160,0.0); transition: background 0.3s; }
    #score { position: absolute; top: 16px; right: 20px; font-size: 13px; letter-spacing: 3px; color: #e6e9ee; pointer-events: none; transition: transform 0.2s; }
    #hold { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); width: 200px; pointer-events: none; opacity: 0; transition: opacity 0.2s; text-align: center; font-size: 11px; letter-spacing: 3px; color: #e6be6a; }
    #hold .meter .fill { background: #e6be6a; }
    #waiting { position: absolute; top: 46%; width: 100%; text-align: center; font-size: 15px; color: #9aa3ad; pointer-events: none; }
    #stats { position: absolute; left: 10px; bottom: 10px; font: 11px/1.45 monospace; color: #a0ffbe; background: rgba(0,0,0,0.62); padding: 8px 10px; border-radius: 4px; white-space: pre; pointer-events: none; max-width: calc(100% - 40px); overflow: hidden; }
    #pip { position: absolute; right: 12px; bottom: 12px; pointer-events: none; display: none; border-radius: 4px; }
    #edge { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 4px; background: rgba(110,200,255,0.18); border: 1px solid rgba(110,200,255,0.6); color: #bfe6ff; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; pointer-events: none; display: none; }
    #calib { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(8,10,14,0.55); pointer-events: none; text-align: center; }
    #calib .big { font-size: 26px; letter-spacing: 6px; color: #fff; } #calib .small { font-size: 14px; color: #bfe6ff; margin-top: 12px; line-height: 1.7; }
    #toast { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    /* ---- Atul's panel ---- */
    #panel { width: 300px; min-width: 300px; height: 100vh; overflow-y: auto; background: #0b0d10; border-left: 1px solid #1d2329; padding: 14px 14px 30px; box-sizing: border-box; font-size: 11px; }
    #panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
    #panel details { border-top: 1px solid #1d2329; padding: 8px 0 4px; }
    #panel summary { cursor: pointer; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #8ab4dc; list-style: none; user-select: none; }
    #panel summary::before { content: '▸ '; } #panel details[open] summary::before { content: '▾ '; }
    #panel h5 { margin: 12px 0 2px; font-size: 10px; color: #b8c3cf; font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
    #panel label { display: block; color: #889; text-transform: uppercase; font-size: 10px; margin: 8px 0 4px; }
    #panel .val { float: right; color: #667; text-transform: none; }
    #panel select, #panel input[type=text] { width: 100%; background: #14181d; color: #dde; border: 1px solid #2a3038; padding: 5px; border-radius: 3px; font-size: 11px; box-sizing: border-box; }
    #panel input[type=range] { width: 100%; }
    #panel button { background: #14181d; color: #bcc; border: 1px solid #2a3038; padding: 5px 8px; border-radius: 3px; font-size: 10px; text-transform: uppercase; cursor: pointer; margin: 6px 4px 0 0; }
    #panel button.on { background: #1f5f8b; color: #fff; border-color: #3b8cc4; }
    #panel button:disabled, #panel select:disabled, #panel input:disabled { opacity: 0.35; cursor: not-allowed; }
    #panel .note { color: #667; font-size: 10px; margin-top: 5px; line-height: 1.5; }
    #panel .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; align-items: center; margin-top: 6px; }
    #panel .row2 label { margin: 0; }
    #net-status { color: #8ab4dc; margin: 6px 0; }
    #quick { position: sticky; top: -14px; z-index: 2; background: #0b0d10; padding: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    #panel #quick button { margin: 0; padding: 5px 7px; }
    #quick kbd { font-family: monospace; color: #7f8a96; margin-left: 3px; }
    #quick button.on kbd { color: #cfe6ff; }
    .tip { color: #5d7a94; cursor: help; text-transform: none; margin-left: 4px; font-size: 11px; }
    #panel .cond.off > * { display: none !important; }
    #panel .cond.off::before { content: attr(data-why); display: block; color: #4a525c; font-size: 10px; margin: 8px 0 2px; padding: 4px 6px; border: 1px dashed #232a31; border-radius: 3px; }
    #panel .cond.off .cond.off::before { display: none; }
    .note.warn { color: #d9a46a; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <div id="hud">
        <div class="label" id="hud-label">together</div>
        <div class="meter" id="m-drift"><div class="zone"></div><div class="fill"></div><div class="mark" style="left:60%"></div><div class="mark" style="left:calc(100% / 1.4)"></div></div>
        <div class="meter thin" id="m-turn"><div class="fill"></div><div class="mark" style="left:calc(100% / 1.4)"></div></div>
      </div>
      <div id="score">CUBES 0</div>
      <div id="hold"><div style="margin-bottom:6px">HOLD</div><div class="meter"><div class="fill"></div></div></div>
      <div id="waiting"></div>
      <div id="edge"></div>
      <div id="calib"><div class="big">MEASURING YOUR FLOOR</div><div class="small" id="calib-text"></div></div>
      <canvas id="pip"></canvas>
      <div id="stats"></div>
      <div id="toast"></div>
    </div>

    <div id="panel">
      <h3>Arm Follow · control panel</h3>
      <div id="quick">
        <button id="btn-pip" title="The live camera with the tracked skeletons on it">Camera <kbd>J</kbd></button><button id="btn-hud" title="Stats for you, bottom left">Stats <kbd>D</kbd></button><button id="btn-viewq" title="Behind → first person → free orbit">View <kbd>V</kbd></button><button id="btn-solo" title="You are P1 and P2 at once: the arm never falls, handy for trying grips">Solo <kbd>S</kbd></button><button id="btn-cal" title="Press, walk to your front, back, left and right edges, press again">Calibrate <kbd>C</kbd></button><button id="btn-restart">Restart <kbd>R</kbd></button><button id="btn-log" title="Save everything that happened as a file">Log <kbd>O</kbd></button>
      </div>

      <details data-key="tracking" open><summary>Tracking</summary>
        <label>Source</label>
        <select id="src"><option value="demo">Demo people (nobody needed)</option><option value="mediapipe">Webcam (MediaPipe)</option></select>
        <div class="cond" id="g-mp" data-why="Webcam settings · choose Webcam as the source">
          <label>Camera</label><select id="cam"></select>
          <label>Hand tracking <span class="tip" title="Body model: 4 points per hand, steady at a distance, rough palm direction. Hand model: 21 points, sees which way the palm faces and how open the hand is, but may drop out at 2–3 m.">ⓘ</span></label>
          <select id="hands"><option value="pose">Body model only (4 points per hand)</option><option value="hand">Add the hand model (21 points)</option></select>
          <label>Body model</label>
          <select id="mpmodel"><option value="lite">Lite (fast)</option><option value="full">Full (steadier, slower)</option></select>
          <label>Webcam field of view <span class="tip" title="Used to guess how far away you are">ⓘ</span><span class="val" id="val-fov"></span></label><input type="range" id="fov" min="40" max="110" step="1">
          <div class="cond" id="g-split" data-why="Finding two people · 1 space only">
            <label>Finding two people</label>
            <select id="mpsplit"><option value="1">Split the picture: one person per half (steadier)</option><option value="0">Both in one picture</option></select>
          </div>
        </div>
        <label>Feel: responsive ⟷ smooth <span class="val" id="val-feel"></span></label><input type="range" id="feel" min="0" max="1" step="0.05">
        <button id="btn-mirror"></button>
        <div class="cond" id="g-comp" data-why="Computer partner · needs the webcam">
          <label>Computer partner <span class="tip" title="For testing alone. As P2 it walks after you, late and no faster than its top speed, so walking briskly leaves the arm behind; its arms copy yours, late. As P1 it walks the body to the cube by itself.">ⓘ</span></label>
          <select id="comp"><option value="off">Off</option><option value="P2">Computer plays P2 (you own the body)</option><option value="P1">Computer plays P1 (you are the arm)</option></select>
          <div class="cond" id="comp-row" data-why="Its timing · when the computer plays">
            <label>It reacts after <span class="val" id="val-cdelay"></span></label><input type="range" id="cdelay" min="0" max="1" step="0.05">
            <label>Its top walking speed <span class="val" id="val-cspeed"></span></label><input type="range" id="cspeed" min="0.2" max="1.5" step="0.05">
          </div>
        </div>
      </details>

      <details data-key="spaces" open><summary>Spaces</summary>
        <select id="spaces"><option value="2">2 spaces: one person per laptop (main)</option><option value="1">1 space: both in one camera</option></select>
        <div class="cond" id="net-row" data-why="Linking laptops · 2 spaces only">
          <button id="btn-host">Host (this is P1)</button>
          <div style="display:flex; gap:5px; margin-top:6px;"><input type="text" id="net-code" maxlength="4" placeholder="HOST'S CODE" style="flex:1; text-transform:uppercase;"><button id="btn-join" style="margin:0">Join (P2)</button></div>
          <label style="display:flex; align-items:center; gap:6px; text-transform:none;"><input type="checkbox" id="net-local" style="width:auto; margin:0;"> Same computer test (two tabs)</label>
          <div id="net-status">offline</div>
          <button id="btn-leave">Disconnect</button>
        </div>
      </details>

      <details data-key="floor"><summary>Floor</summary>
        <div class="note" id="cal-status"></div>
        <button id="btn-calclear">Forget floor</button>
        <label>The measured floor sets <span class="tip" title="Walk gain: your floor stretches to fill the room (up to 4×). Where cubes appear: always somewhere you can reach, the first at your far edge.">ⓘ</span></label>
        <select id="caluse" class="world"><option value="both">The walk gain + where cubes appear</option><option value="gain">Only the walk gain</option><option value="cubes">Only where cubes appear</option></select>
        <div class="cond" id="g-roomfit" data-why="Rooms of different sizes · 2 spaces only">
          <label>Rooms of different sizes <span class="tip" title="Mapped: P2's steps are scaled into P1's room (half as deep = each step counts double). Smaller: both use a patch the size of the smaller room.">ⓘ</span></label>
          <select id="roomfit" class="world"><option value="mapped">Map each room onto the other</option><option value="smaller">Both use the smaller room</option></select>
        </div>
        <div class="cond" id="g-gain" data-why="Walk gain · set by the measured floor">
          <label>Walk gain <span class="val" id="val-gain"></span></label><input type="range" id="gain" class="world" min="1" max="3" step="0.1">
        </div>
        <div class="cond" id="g-area" data-why="Where new cubes appear · set by the measured floor">
          <label>New cubes appear within (real floor) <span class="val" id="val-area"></span></label>
          <div class="row2"><input type="range" id="areaW" class="world" min="0.6" max="3" step="0.1"><input type="range" id="areaD" class="world" min="0.6" max="3" step="0.1"></div>
        </div>
        <button id="btn-edge" class="world" title="A banner names the edge you're near; P1 also sees a grid wall fade in"></button>
        <div class="cond" id="g-edged" data-why="Warning distance · edge warning is off">
          <label>Warn this close to an edge <span class="val" id="val-edged"></span></label><input type="range" id="edged" class="world" min="0.1" max="0.8" step="0.05">
        </div>
      </details>

      <details data-key="own" open><summary>Who owns what <span class="tip" title="Legs and torso stay P1's. Each person uses their own arm on the same side.">ⓘ</span></summary>
        <label>P2 possesses</label>
        <select id="own" class="world"><option value="R">The right arm</option><option value="L">The left arm</option><option value="both">Both arms</option><option value="custom">Custom, arm by arm</option></select>
        <div class="cond" id="own-row" data-why="Arm by arm · Custom only">
          <div class="row2"><label>Left arm</label><select id="ownL" class="world"><option value="1">P1</option><option value="2">P2</option></select><label>Right arm</label><select id="ownR" class="world"><option value="1">P1</option><option value="2">P2</option></select></div>
        </div>
      </details>

      <details data-key="follow" open><summary>Follow rule <span class="tip" title="The arm is left behind above either tolerance, and comes back under 60% of both.">ⓘ</span></summary>
        <label>Drift tolerance <span class="val" id="val-tol"></span></label><input type="range" id="tol" class="world" min="0.1" max="1.5" step="0.05">
        <label>Turning tolerance <span class="val" id="val-turn"></span></label><input type="range" id="turn" class="world" min="10" max="120" step="5">
        <button id="btn-ghost" class="world" title="A ring on the floor showing where P2 is, compared to the body"></button>
      </details>

      <details data-key="lifeless" open><summary>Lifeless arm</summary>
        <select id="lifeless" class="world"><option value="fall">Falls off and lies on the floor</option><option value="limp">Hangs limp on the shoulder</option></select>
        <button id="btn-curl" class="world" title="Fingers curl when lifeless and twitch back to life after the snap"></button>
        <div class="cond" id="g-fall" data-why="Falling and lying · when it falls off">
          <button id="btn-puppet" class="world" title="Loose at elbow and wrist, swings, bounces once. Off: a stiff, mechanical drop"></button><button id="btn-lyingf" class="world" title="The lying arm still follows P2, late and weakly"></button><button id="btn-twitch" class="world" title="Small twitches when P2 moves a lot"></button>
          <div class="cond" id="g-lying" data-why="How it follows · when 'lying follows' is on">
            <label>Follows P2 this late <span class="val" id="val-lag"></span></label><input type="range" id="lag" class="world" min="0" max="1.5" step="0.05">
            <label>…and this strongly <span class="val" id="val-lstr"></span></label><input type="range" id="lstr" class="world" min="0" max="1" step="0.05">
          </div>
        </div>
        <h5>Coming back</h5>
        <select id="rstyle" class="world"><option value="strings">Pulled up on invisible strings (jerky, dangling)</option><option value="glide">Glides back (smooth, mechanical)</option></select>
        <div class="cond" id="g-rtime" data-why="String time · when pulled up on strings">
          <label>Strings take <span class="val" id="val-rtime"></span></label><input type="range" id="rtime" class="world" min="0.5" max="3" step="0.1">
        </div>
        <button id="btn-over" class="world" title="Snaps into the shoulder with a small springy overshoot"></button><button id="btn-strings" class="world" title="Thin lines up from the arm, only while lifeless or being pulled back"></button>
      </details>

      <details data-key="pickup" open><summary>Picking up <span class="tip" title="The big two-hand cube. Palms moving apart lets go in every grip; a lifeless arm can't hold.">ⓘ</span></summary>
        <label>Grip</label>
        <select id="grip" class="world"><option value="squeeze">Squeeze to hold (slips if you ease off)</option><option value="palm">Palms facing = grip</option><option value="touch">Just touching (no gesture)</option><option value="dwell">Dwell 0.5 s (fallback)</option></select>
        <label>Which hands can hold</label>
        <select id="holders" class="world"><option value="any">Any hand</option><option value="possessed">Only possessed hands</option></select>
        <div class="note warn" id="holders-note"></div>
        <label>Touching distance <span class="tip" title="How close a palm has to be to count as touching. Webcam depth is a guess, so this is generous.">ⓘ</span><span class="val" id="val-touch"></span></label><input type="range" id="touch" class="world" min="0.03" max="0.2" step="0.01">
        <label>Hold above the waist for <span class="val" id="val-hold"></span></label><input type="range" id="hold-t" class="world" min="0.5" max="5" step="0.5">
      </details>

      <details data-key="view"><summary>View</summary>
        <label>View (V)</label>
        <select id="view"><option value="behind">Behind the body (over the shoulder)</option><option value="first">First person (VR preview)</option><option value="orbit">Free orbit (drag)</option></select>
        <label>The view faces</label>
        <select id="camlock"><option value="forward">Always forward (never turns)</option><option value="cube">Toward the cube (lock-on)</option><option value="turn">Wherever the body faces (slowly)</option></select>
        <label>Near the cube, the camera <span class="tip" title="As you get close to the cube (or while holding it) the camera moves in to examine, like in a game, so you can see where your hands are.">ⓘ</span></label>
        <select id="examine"><option value="high">Moves up and looks down</option><option value="side">Moves to the side</option><option value="front">Moves in front, looking back at you</option><option value="off">Stays put</option></select>
        <div class="cond" id="g-exam" data-why="How close · when the camera moves in">
          <label>Starts moving in at <span class="val" id="val-examd"></span></label><input type="range" id="examd" min="0.6" max="3" step="0.1">
        </div>
        <button id="btn-xray" title="Near the cube the body fades, so your arms and the cube show through it"></button>
        <label>Body may turn up to <span class="tip" title="Past this the body stops turning. 180° = no limit.">ⓘ</span><span class="val" id="val-turnmax"></span></label><input type="range" id="turnmax" class="world" min="10" max="180" step="5">
      </details>
      <div class="note" id="lock-all" style="display:none; color:#8ab4dc;">Linked as P2: P1’s laptop decides everything here. You can only disconnect.</div>
      <div class="note">Keys: H hides this panel · F fullscreen</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    window.THREE = THREE; window.OrbitControls = OrbitControls;
    // MediaPipe loads on the side, so the room works even without it
    import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs')
      .then(m => { window.FilesetResolver = m.FilesetResolver; window.PoseLandmarker = m.PoseLandmarker; window.HandLandmarker = m.HandLandmarker; window.mediaPipeLoaded = true; })
      .catch(e => { window.mediaPipeError = String(e && e.message || e); });
    // the rest is plain scripts (so it also runs by opening index.html)
    for (const f of ['track.js', 'sim.js', 'floor.js', 'scene.js', 'net.js', 'ui.js']) {
      await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = f; s.onload = ok; s.onerror = () => fail(new Error(f + ' did not load')); document.body.appendChild(s); });
    }
  </script>
</body>
</html>
